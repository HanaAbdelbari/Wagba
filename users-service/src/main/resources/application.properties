server.port=5001

spring.application.name=users-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.datasource.username=users_user
spring.datasource.password=dev_password

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=7
spring.rabbitmq.password=

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
wagba.jwt.issuer=wagba-users-service
wagba.jwt.private-key-path=keys/private.pem
wagba.jwt.public-key-path=keys/public.pem
wagba.jwt.access-token-ttl=15m
wagba.jwt.refresh-token-ttl=14d
wagba.jwt.generate-if-missing=true

# First SuperAdmin. Created once at startup, only if no SuperAdmin exists.
wagba.bootstrap.admin-email=${WAGBA_ADMIN_EMAIL:}
wagba.bootstrap.admin-password=${WAGBA_ADMIN_PASSWORD:}
wagba.bootstrap.admin-name=Super Admin

# RabbitMQ publisher confirms: the broker acknowledges every published message
spring.rabbitmq.publisher-confirm-type=simple

# Events
wagba.events.exchange=wagba.events

# Outbox publisher
wagba.outbox.poll-interval-ms=1000
wagba.outbox.batch-size=50

# Show the correlation id in every log line
logging.pattern.level=%5p [%X{correlationId:-}]

# Verification codes (password reset / email verification)
# pepper is a secret on server to protect the generated code
wagba.verification.pepper=${WAGBA_VERIFICATION_PEPPER:dev-only-pepper-change-me}
wagba.verification.code-ttl-minutes=15
wagba.verification.max-attempts=5
wagba.verification.cooldown-seconds=60