server.port=5002
spring.application.name=restaurant-portal-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_portal_db
spring.datasource.username=restaurant_user
spring.datasource.password=dev_password

# JPA / Flyway
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=simple

# JWT: this service only VERIFIES tokens with the public key. It never has the private key.
wagba.jwt.issuer=wagba-users-service
wagba.jwt.public-key-path=keys/public.pem

management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [%X{correlationId:-}]